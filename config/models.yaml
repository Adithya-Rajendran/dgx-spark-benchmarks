# Model server configurations as run (images, quantization, flags). Paths are from the private harness.
models:
  qwen3.8-27b:
    tier: <=32GB
    engine: vllm
    image: vllm/vllm-openai:nightly-77154ca6116ae34cbfe314beef1016bde9b63989
    weights: local/qwen3.8-27b-nvfp4
    port: 9120
    effort: medium
    args: --served-model-name qwen3.8-27b --host 127.0.0.1 --port 9120 --max-model-len 131072 --max-num-seqs 16 --gpu-memory-utilization 0.60 --kv-cache-dtype fp8 --enable-prefix-caching --quantization
      modelopt --speculative-config '{"method":"mtp","num_speculative_tokens":3}' --chat-template /templates/qwen3.8-inline-system.jinja --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser
      qwen3 --language-model-only
  ornith-1.5-35b:
    tier: <=32GB
    engine: vllm
    image: nvcr.io/nvidia/vllm:26.09-py3
    weights: legacy/ornith-1.5-35b
    port: 9111
    shm_size: 16g
    env:
      VLLM_USE_V2_MODEL_RUNNER: '0'
    args: --served-model-name ornith-1.5-35b --host 127.0.0.1 --port 9111 --max-model-len 131072 --gpu-memory-utilization 0.60 --kv-cache-memory-bytes 40000000000 --max-num-seqs 32 --quantization modelopt
